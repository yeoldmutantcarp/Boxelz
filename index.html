<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Elemental Sandbox · 511 Elements · Trump Animated</title>
<style>
  :root{--bg:#07070b;--panel:rgba(16,16,24,.9);--panel-brd:rgba(255,255,255,.09);
    --text:#e8e8f2;--muted:#8c8ca0;--accent:#5ee0a0;--bottom-h:56px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--text);user-select:none;font-size:12px}
  #stage{position:fixed;left:0;right:0;top:0;bottom:var(--bottom-h,56px)}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair;touch-action:none}
  .top-hud{position:fixed;top:0;left:0;right:0;padding:8px 8px 0;z-index:20;
    pointer-events:none;display:flex;flex-direction:column;gap:6px}
  .bar{pointer-events:auto;background:var(--panel);border:1px solid var(--panel-brd);
    border-radius:12px;backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.6);overflow:hidden}
  .el-tabs{display:flex;gap:2px;padding:6px 6px 0;flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.06)}
  .tab{padding:5px 9px;border-radius:7px 7px 0 0;font-size:11px;font-weight:600;
    cursor:pointer;background:transparent;border:none;color:var(--muted);font-family:inherit}
  .tab:hover{color:var(--text);background:rgba(255,255,255,.05)}
  .tab.on{color:#dffcef;background:rgba(94,224,160,.14);box-shadow:inset 0 -2px 0 var(--accent)}
  .search-row{padding:6px 8px 0}
  #searchInput{width:100%;padding:5px 9px;border-radius:6px;background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.10);color:var(--text);font-family:inherit;font-size:11px;outline:none}
  .elements{display:flex;flex-wrap:wrap;gap:3px;padding:7px;max-height:20vh;overflow-y:auto;scrollbar-width:thin}
  .elements::-webkit-scrollbar{width:6px}
  .elements::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
  .el{display:flex;align-items:center;gap:5px;padding:4px 8px 4px 6px;border-radius:6px;
    background:rgba(255,255,255,.045);border:1px solid transparent;cursor:pointer;
    font-size:10.5px;color:var(--muted);font-family:inherit;white-space:nowrap;line-height:1.1}
  .el:hover{background:rgba(255,255,255,.10);color:var(--text)}
  .el.on{background:rgba(94,224,160,.16);border-color:rgba(94,224,160,.55);color:#e0ffef}
  .el.hidden{display:none}
  .sw{width:10px;height:10px;border-radius:2px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
  .minimap-wrap{position:fixed;top:10px;right:10px;z-index:22;border-radius:6px;overflow:hidden;
    border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.6);pointer-events:none}
  #minimap{display:block;width:120px;height:75px}
  .panel{position:fixed;padding:8px 10px;background:var(--panel);border:1px solid var(--panel-brd);
    border-radius:10px;z-index:22;backdrop-filter:blur(14px);font-size:11px;display:none}
  .panel.show{display:block}
  #infoPanel{bottom:70px;right:10px;min-width:160px}
  #statsPanel{top:100px;right:10px;min-width:140px}
  #logPanel{bottom:70px;left:10px;min-width:180px}
  .view-ctrl{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:22;
    display:flex;flex-direction:column;gap:4px}
  .view-ctrl button{width:32px;height:32px;border-radius:8px;cursor:pointer;
    background:rgba(16,16,24,.8);border:1px solid rgba(255,255,255,.10);color:var(--text);
    font-size:14px;font-weight:700;backdrop-filter:blur(10px)}
  .view-ctrl button:hover{background:rgba(94,224,160,.18)}
  .bottom-hud{position:fixed;left:0;right:0;bottom:0;padding:0 8px 10px;z-index:20;pointer-events:none}
  .controls{display:flex;align-items:center;gap:5px;padding:8px 10px;flex-wrap:wrap}
  .ctl{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);padding:0 2px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:60px;height:4px;border-radius:99px;
    background:rgba(255,255,255,.16);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:var(--accent);cursor:pointer}
  .btn{padding:5px 9px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid var(--panel-brd);color:var(--text);font-family:inherit}
  .btn:hover{background:rgba(255,255,255,.13)}
  .btn.on{background:rgba(94,224,160,.18);border-color:rgba(94,224,160,.5);color:#dffcef}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.fun{background:rgba(255,180,80,.12);border-color:rgba(255,180,80,.35)}
  .btn.fun:hover{background:rgba(255,180,80,.22)}
  .btn.fun.on{background:rgba(255,120,80,.28);border-color:rgba(255,120,80,.7);color:#ffd9b3}
  .spacer{flex:1;min-width:8px}
  .stat{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;
    font-family:ui-monospace,monospace;white-space:nowrap}
  select.btn{-webkit-appearance:none;appearance:none;padding-right:18px}
  .tooltip{position:fixed;padding:4px 8px;border-radius:5px;pointer-events:none;
    background:rgba(10,10,18,.94);border:1px solid rgba(255,255,255,.12);font-size:11px;
    z-index:60;display:none;white-space:pre;font-family:ui-monospace,monospace;line-height:1.4}
  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 20px;
    background:rgba(20,20,30,.94);border:1px solid var(--panel-brd);border-radius:10px;
    font-size:12px;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .panel h4{margin:0 0 5px;font-size:10px;font-weight:700;letter-spacing:1.5px;
    text-transform:uppercase;color:var(--muted)}
  .stat-row{display:flex;justify-content:space-between;gap:10px;padding:1px 0;
    font-family:ui-monospace,monospace;font-size:10px}
  .log-line{padding:1px 0;font-family:ui-monospace,monospace;font-size:10px;
    border-top:1px solid rgba(255,255,255,.05)}
  .log-line:first-child{border-top:0}
  #coordPanel{bottom:70px;right:180px;font-family:ui-monospace,monospace;font-size:10px;
    color:var(--muted);background:rgba(0,0,0,.5);padding:3px 7px;border-radius:5px;z-index:22;
    display:block;position:fixed;pointer-events:none}
  @media(max-width:800px){.el span:last-child{display:none}.el{padding:4px 5px}
    input[type=range]{width:45px}#minimap{width:80px;height:50px}}
</style>
</head>
<body>

<div id="stage"><canvas id="view"></canvas></div>

<div class="top-hud"><div class="bar">
  <div class="el-tabs" id="tabs"></div>
  <div class="search-row"><input type="text" id="searchInput" placeholder="Search 511 elements…"></div>
  <div class="elements" id="elements"></div>
</div></div>

<div class="minimap-wrap"><canvas id="minimap" width="120" height="75"></canvas></div>
<div class="view-ctrl">
  <button id="zoomIn">+</button><button id="zoomOut">−</button><button id="zoomReset">⊙</button>
</div>

<div id="infoPanel" class="panel"><h4>Element</h4><div id="infoContent">Select an element</div></div>
<div id="statsPanel" class="panel"><h4>Live Stats</h4><div id="statsContent">Enable from toolbar</div></div>
<div id="logPanel" class="panel"><h4>Reaction Log</h4><div id="logContent"></div></div>
<div id="coordPanel">—</div>

<div class="bottom-hud" id="bottomHud"><div class="bar controls">
  <div class="ctl" style="gap:3px">
    <button class="btn" data-tool="brush">Brush</button>
    <button class="btn" data-tool="line">Line</button>
    <button class="btn" data-tool="rect">Rect</button>
    <button class="btn" data-tool="fill">Fill</button>
    <button class="btn" data-tool="erase">Erase</button>
    <button class="btn" data-tool="eyedropper">🎨</button>
    <button class="btn" data-tool="heat">🔥</button>
    <button class="btn" data-tool="cool">❄️</button>
    <button class="btn fun" data-tool="explosion">💥</button>
    <button class="btn fun" data-tool="meteor">☄️</button>
    <button class="btn fun" data-tool="tornado">🌀</button>
  </div>
  <div class="ctl">Size <input type="range" id="brush" min="1" max="30" value="5"><span class="stat" id="brushVal">5</span></div>
  <div class="ctl">Speed <input type="range" id="speed" min="0.1" max="8" step="0.1" value="1"><span class="stat" id="speedVal">1x</span></div>
  <button class="btn" id="undoBtn">↶</button>
  <button class="btn" id="redoBtn">↷</button>
  <button class="btn" id="pauseBtn">Pause</button>
  <button class="btn" id="stepBtn">Step</button>
  <button class="btn" id="symBtn">Mirror</button>
  <button class="btn" id="tempBtn">Heat</button>
  <button class="btn" id="randomBtn">🎲</button>
  <button class="btn" id="gridBtn">Grid</button>
  <button class="btn" id="statsBtn">Stats</button>
  <button class="btn" id="logBtn">Log</button>
  <button class="btn" id="weatherBtn">Rain</button>
  <button class="btn" id="nightBtn">Night</button>
  <button class="btn fun" id="soundBtn">🔊</button>
  <button class="btn fun" id="slowBtn">⏱️</button>
  <button class="btn fun" id="rainbowBtn">🌈</button>
  <button class="btn fun" id="fullBtn">⛶</button>
  <button class="btn" id="saveBtn">Save</button>
  <button class="btn" id="loadBtn">Load</button>
  <button class="btn" id="shotBtn">📷</button>
  <button class="btn" id="clearBtn">Clear</button>
  <button class="btn" id="resetBtn">↺</button>
  <select class="btn" id="slotSel"><option value="1">Slot 1</option><option value="2">Slot 2</option><option value="3">Slot 3</option></select>
  <select class="btn" id="presetSel">
    <option value="">Scenes…</option>
    <option value="trump">🇺🇸 Trump Rally</option>
    <option value="garden">Garden</option><option value="volcano">Volcano</option>
    <option value="ocean">Ocean</option><option value="forest">Forest</option>
    <option value="winter">Winter</option><option value="reactor">Reactor</option>
    <option value="lab">Lab</option><option value="village">Village</option>
    <option value="city">City</option><option value="zoo">Zoo</option>
    <option value="blank">Blank</option>
  </select>
  <div class="spacer"></div>
  <span class="stat" id="fps">— fps</span>
  <span class="stat" id="cells">—</span>
</div></div>

<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

/* ═══════════ ELEMENT SYSTEM ═══════════ */
const ELEMENTS = [];
const EL = {};
function add(o) {
  o.id = ELEMENTS.length;
  o.variance = o.variance ?? 12;
  o.flammable = o.flammable ?? 0;
  o.ignition = o.ignition ?? Infinity;
  o.dispersion = o.dispersion ?? 0;
  o.glow = o.glow ?? null;
  ELEMENTS.push(o);
  EL[o.name] = o;
  return o.id;
}
function batch(items) {
  for (const it of items) add({name:it[0],cat:it[1],type:it[2],density:it[3],color:it[4],...(it[5]||{})});
}

/* ── TOOLS ── */
const EMPTY    = add({name:'Erase',    cat:'tool',type:'empty', density:1,    color:[0,0,0],        variance:0});
const WALL     = add({name:'Wall',     cat:'tool',type:'static',density:1e9,  color:[86,86,98],     variance:6});
const WIRE     = add({name:'Wire',     cat:'tool',type:'static',density:8000, color:[196,132,72],   variance:10});
const BATTERY  = add({name:'Battery',  cat:'tool',type:'static',density:9000, color:[80,180,80],    variance:10,glow:[60,200,60]});
const CLONER   = add({name:'Cloner',   cat:'tool',type:'static',density:9000, color:[180,80,220],   variance:10,glow:[160,60,220]});
const VOID     = add({name:'Void',     cat:'tool',type:'static',density:9000, color:[24,10,38],     variance:6, glow:[100,30,180]});
const SPOUT    = add({name:'Spout',    cat:'tool',type:'static',density:9000, color:[40,140,200],   variance:8, glow:[40,140,200]});
const TNT      = add({name:'TNT',      cat:'tool',type:'static',density:1000, color:[180,50,40],    variance:10,ignition:200,explosion:10});
const NITRO    = add({name:'Nitro',    cat:'tool',type:'static',density:1100, color:[220,60,140],   variance:10,ignition:80, explosion:15});
const HEATER   = add({name:'Heater',   cat:'tool',type:'static',density:9000, color:[220,80,40],    variance:8, glow:[255,110,40]});
const COOLER   = add({name:'Cooler',   cat:'tool',type:'static',density:9000, color:[80,140,220],   variance:8, glow:[100,180,255]});
const ANTIGRAV = add({name:'Antigrav', cat:'tool',type:'static',density:9000, color:[180,180,255],  variance:8, glow:[180,180,255]});

/* ── GASES ── */
const FIRE       = add({name:'Fire',       cat:'gas',type:'gas',density:0.3, color:[255,140,40],  variance:0, glow:[255,120,30]});
const SMOKE      = add({name:'Smoke',      cat:'gas',type:'gas',density:0.4, color:[74,74,84],    variance:14});
const STEAM      = add({name:'Steam',      cat:'gas',type:'gas',density:0.5, color:[196,212,228], variance:10,condenseName:'Water'});
const SPARK      = add({name:'Spark',      cat:'gas',type:'gas',density:0.2, color:[220,240,255], variance:0, glow:[180,220,255]});
const PLASMA     = add({name:'Plasma',     cat:'gas',type:'gas',density:0.15,color:[200,220,255], variance:0, glow:[180,200,255]});
const HYDROGEN   = add({name:'Hydrogen',   cat:'gas',type:'gas',density:0.1, color:[200,220,255], variance:6, ignition:200,explosion:6});
const METHANE    = add({name:'Methane',    cat:'gas',type:'gas',density:0.6, color:[140,200,160], variance:10,ignition:500,flammable:0.30});
const ACID_VAPOR = add({name:'Acid Vapor', cat:'gas',type:'gas',density:0.9, color:[140,220,80],  variance:8, glow:[100,190,50]});

/* ── LIQUIDS ── */
const WATER     = add({name:'Water',     cat:'liquid',type:'liquid',density:1000, color:[56,110,220], variance:14,dispersion:3,freeze:0,freezeName:'Ice',boil:100,boilName:'Steam'});
const LAVA      = add({name:'Lava',      cat:'liquid',type:'liquid',density:2500, color:[236,92,22],  variance:16,dispersion:1,glow:[255,90,20],freeze:850,freezeName:'Stone'});
const MAGMA     = add({name:'Magma',     cat:'liquid',type:'liquid',density:2800, color:[255,60,10],  variance:14,dispersion:1,glow:[255,80,20],freeze:900,freezeName:'Obsidian'});
const MOLTEN    = add({name:'Molten',    cat:'liquid',type:'liquid',density:7000, color:[255,120,40], variance:14,dispersion:1,glow:[255,140,40],freeze:1400,freezeName:'Metal'});
const ACID      = add({name:'Acid',      cat:'liquid',type:'liquid',density:1100, color:[130,236,70], variance:14,dispersion:3,glow:[70,190,40]});
const SALTWATER = add({name:'Saltwater', cat:'liquid',type:'liquid',density:1030, color:[100,160,210],variance:12,dispersion:3,boil:100,boilName:'Steam'});
const LIN       = add({name:'Liq. N₂',   cat:'liquid',type:'liquid',density:808,  color:[180,220,240],variance:8, dispersion:3,glow:[120,180,220]});
const POISON    = add({name:'Poison',    cat:'liquid',type:'liquid',density:1100, color:[140,60,180], variance:10,dispersion:3,glow:[100,40,140]});
const BLOOD     = add({name:'Blood',     cat:'liquid',type:'liquid',density:1060, color:[160,20,30],  variance:12,dispersion:3});
const SLIME     = add({name:'Slime',     cat:'liquid',type:'liquid',density:1200, color:[120,200,100],variance:14,dispersion:1,glow:[80,180,60]});
const OIL       = add({name:'Oil',       cat:'liquid',type:'liquid',density:800,  color:[92,68,36],   variance:14,dispersion:2,ignition:160,flammable:0.12});

/* ── POWDERS ── */
const SAND       = add({name:'Sand',       cat:'powder',type:'powder',density:1600,color:[222,184,110],variance:18,melt:1700,meltName:'Glass'});
const SNOW       = add({name:'Snow',       cat:'powder',type:'powder',density:300, color:[238,246,255],variance:8, melt:0,   meltName:'Water'});
const SALT       = add({name:'Salt',       cat:'powder',type:'powder',density:2160,color:[242,242,242],variance:8});
const SEED       = add({name:'Seed',       cat:'powder',type:'powder',density:500, color:[190,160,90], variance:14});
const DIRT       = add({name:'Dirt',       cat:'powder',type:'powder',density:1500,color:[120,84,52],  variance:16});
const MAGNESIUM  = add({name:'Magnesium',  cat:'powder',type:'powder',density:1700,color:[210,210,215],variance:8, ignition:400,flammable:0.40,glow:[255,255,220]});
const ASH        = add({name:'Ash',        cat:'powder',type:'powder',density:700, color:[92,90,88],   variance:16});
const GUNPOWDER  = add({name:'Gunpowder',  cat:'powder',type:'powder',density:900, color:[58,56,54],   variance:12,ignition:150,explosion:6});

/* ── SOLIDS ── */
const STONE    = add({name:'Stone',    cat:'solid',type:'static',density:2600,color:[112,114,126],variance:14,melt:1150,meltName:'Lava'});
const ICE      = add({name:'Ice',      cat:'solid',type:'static',density:900, color:[160,222,246],variance:10,melt:0,meltName:'Water'});
const WOOD     = add({name:'Wood',     cat:'solid',type:'static',density:700, color:[116,78,42],  variance:16,ignition:260,flammable:0.06});
const GLASS    = add({name:'Glass',    cat:'solid',type:'static',density:2500,color:[170,212,226],variance:8});
const METAL    = add({name:'Metal',    cat:'solid',type:'static',density:7800,color:[140,144,152],variance:10,melt:1500,meltName:'Molten'});
const OBSIDIAN = add({name:'Obsidian', cat:'solid',type:'static',density:2800,color:[34,28,48],   variance:8, melt:2000,meltName:'Magma'});
const PLANT    = add({name:'Plant',    cat:'solid',type:'static',density:400, color:[62,156,66],  variance:20,ignition:220,flammable:0.10});
const FUNGUS   = add({name:'Fungus',   cat:'solid',type:'static',density:600, color:[180,80,150], variance:16,ignition:250,flammable:0.08});
const IRON     = add({name:'Iron',     cat:'solid',type:'static',density:7870,color:[140,140,150],variance:10,melt:1538,meltName:'Molten'});
const COPPER   = add({name:'Copper',   cat:'solid',type:'static',density:8900,color:[210,120,60], variance:10,melt:1300,meltName:'Molten'});
const ZINC     = add({name:'Zinc',     cat:'metal',type:'static',density:7140,color:[180,180,195],variance:8,melt:420,meltName:'Molten'});
const ALUMINUM = add({name:'Aluminum', cat:'metal',type:'static',density:2700,color:[200,200,210],variance:8,melt:660,meltName:'Molten'});
const STEEL    = add({name:'Steel',    cat:'metal',type:'static',density:7850,color:[160,160,170],variance:8,melt:1500,meltName:'Molten'});
const FLESH = add({name:'Flesh', cat:'bio',type:'static',density:1000,color:[200,80,90],variance:14,ignition:260,flammable:0.05});

/* ── CREATURES ── */
const HUMAN     = add({name:'Human',     cat:'life',type:'static',density:1000,color:[224,180,140],variance:6,ignition:300,flammable:0.05});
const ZOMBIE    = add({name:'Zombie',    cat:'life',type:'static',density:1000,color:[110,150,100],variance:6});
const SKELETON  = add({name:'Skeleton',  cat:'life',type:'static',density:800, color:[230,225,200],variance:6});
const GHOST     = add({name:'Ghost',     cat:'life',type:'gas',   density:0.1, color:[200,220,255],variance:4,glow:[180,200,255]});
const ROBOT     = add({name:'Robot',     cat:'life',type:'static',density:2000,color:[160,170,190],variance:8,glow:[120,200,240]});
const CAT       = add({name:'Cat',       cat:'life',type:'static',density:700, color:[240,180,100],variance:10,ignition:280,flammable:0.08});
const DOG       = add({name:'Dog',       cat:'life',type:'static',density:800, color:[180,140,80], variance:10,ignition:280,flammable:0.08});
const BIRD      = add({name:'Bird',      cat:'life',type:'gas',   density:0.4, color:[80,140,220], variance:8, ignition:280,flammable:0.08});
const FISH      = add({name:'Fish',      cat:'life',type:'liquid',density:900, color:[230,130,80], variance:8});
const SPIDER    = add({name:'Spider',    cat:'life',type:'static',density:600, color:[30,20,20],   variance:6, ignition:280,flammable:0.10});
const SNAKE     = add({name:'Snake',     cat:'life',type:'static',density:800, color:[60,140,60],  variance:10,ignition:280,flammable:0.08});
const COW       = add({name:'Cow',       cat:'life',type:'static',density:1000,color:[240,240,240],variance:6, ignition:280,flammable:0.06});
const CHICKEN   = add({name:'Chicken',   cat:'life',type:'static',density:600, color:[240,220,180],variance:6, ignition:280,flammable:0.10});
const BEE       = add({name:'Bee',       cat:'life',type:'gas',   density:0.3, color:[240,200,60], variance:8, ignition:280,flammable:0.12});
const BUTTERFLY = add({name:'Butterfly', cat:'life',type:'gas',   density:0.3, color:[200,120,220],variance:14,ignition:280,flammable:0.10});
const WOLF      = add({name:'Wolf',      cat:'creature',type:'static',density:800,color:[120,110,100],variance:8,ignition:280,flammable:0.08});

let audioCtx = null;
let lastSoundTime = 0;
function ensureAudio() {
  if (audioCtx) return;
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
}
function playSound(type, vol = 0.15) {
  if (!soundEnabled) return;
  ensureAudio();
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  if (now - lastSoundTime < 0.05) return;
  lastSoundTime = now;
  try {
    if (type === 'explosion') {
      const dur = 0.5;
      const bs = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bs; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/bs, 2);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const f = audioCtx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(800, now);
      f.frequency.exponentialRampToValueAtTime(80, now + dur);
      const g = audioCtx.createGain();
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(f).connect(g).connect(audioCtx.destination);
      src.start(now); src.stop(now + dur);
    } else if (type === 'firework') {
      const dur = 0.4;
      const bs = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, bs, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bs; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/bs, 3);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const f = audioCtx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 500;
      const g = audioCtx.createGain();
      g.gain.value = vol * 0.5;
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      src.connect(f).connect(g).connect(audioCtx.destination);
      src.start(now);
    } else if (type === 'zap') {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.1);
      const g = audioCtx.createGain();
      g.gain.value = vol * 0.2;
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(g).connect(audioCtx.destination);

  } catch(e) {}
}

/* ═══════════ MOVEMENT ═══════════ */
function canFall(e, target) {

  return ELEMENTS[e].density > te.density;
}
function canRise(e, target) {
  if (target === EMPTY) return true;
  const te = ELEMENTS[target];
  if (te.type === 'static' || te.type === 'powder') return false;
  return ELEMENTS[e].density < te.density;
}
function tryDown(x, y, e) {

  return false;
}
function tryDiagDown(x, y, e, dir) {

  return false;
}

}
function flowHorizontal(x, y, e, disp) {

  const dir = Math.random() < 0.5 ? -1 : 1;
  let steps = 0;
  while (steps < disp) {
    const nx = x + dir*(steps+1);
    if (nx < 0 || nx >= W) break;
    if (!canFall(e, cells[y*W+nx])) break;
    steps++;

  return false;
}

  const d = Math.random() < 0.5 ? 1 : -1;

}
function moveGas(x, y, e) {

    const d = Math.random() < 0.5 ? 1 : -1;
    if (x+d >= 0 && x+d < W && canRise(e, cells[(y-1)*W+x+d])) { moveTo(x,y,x+d,y-1); return; }

  }
  const hx = x + (Math.random() < 0.5 ? -1 : 1);

    const nx = x + dx, ny = y + dy;
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = ny*W + nx;
    cells[j] = TRUMP;
    cvar[j] = cv;
    temp[j] = tp;
    trumpOwner[j] = unit.id;
    moved[j] = 1;
    newSet.add(j);
    dirty(nx, ny);
  }
  unit.cells = newSet;
  return true;
}

function updateTrumpUnits() {
  for (let u = trumpUnits.length - 1; u >= 0; u--) {
    const unit = trumpUnits[u];
    unit.animFrame++;

    let cellCount = 0, minX = W, maxX = -1, minY = H, maxY = -1;
    for (const i of unit.cells) {
      if (cells[i] === TRUMP && trumpOwner[i] === unit.id) {
        cellCount++;
        const x = i % W, y = (i/W)|0;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
    if (cellCount < 50) { trumpUnits.splice(u, 1); continue; }

    unit.baseX = minX;
    unit.baseY = minY;

    if (unit.stateTimer > 0) unit.stateTimer--;
    else {
      const r = Math.random();
      let next;
      if (r < 0.30) next = 'walk';
      else if (r < 0.45) next = 'idle';
      else if (r < 0.60) next = 'dance';
      else if (r < 0.72) next = 'talk';
      else if (r < 0.82) next = 'wave';
      else if (r < 0.92) next = 'jump';
      else next = 'celebrate';

      unit.state = next;
      if (next === 'walk') unit.stateTimer = 120 + ((Math.random()*100)|0);
      else if (next === 'idle') unit.stateTimer = 60 + ((Math.random()*60)|0);
      else if (next === 'dance') unit.stateTimer = 100 + ((Math.random()*80)|0);
      else if (next === 'talk') unit.stateTimer = 80 + ((Math.random()*60)|0);
      else if (next === 'wave') unit.stateTimer = 45 + ((Math.random()*30)|0);
      else if (next === 'jump') { unit.stateTimer = 30 + ((Math.random()*20)|0); unit.jumpTimer = 0; }
      else if (next === 'celebrate') {
        unit.stateTimer = 100 + ((Math.random()*40)|0);
        const cx = unit.baseX + 11, cy = unit.baseY + 5;
        for (let k = 0; k < 40; k++) {
          const col = TRUMP_COLORS[(Math.random()*7)|0];
          spawnParticles(cx, cy, 1, col, 3);
        }
        playSound('firework');
      }
    }

    unit.blinkTimer--;
    if (unit.blinkTimer <= 0) {
      unit.blinkActive = true;
      if (unit.blinkTimer < -4) {
        unit.blinkActive = false;
        unit.blinkTimer = 60 + ((Math.random()*90)|0);
      }
    }

    if (unit.state === 'talk') {
      unit.mouthTimer++;
      unit.mouthOpen = (unit.mouthTimer % 8) < 4;
    } else { unit.mouthOpen = false; unit.mouthTimer = 0; }

    const f = unit.animFrame;

    if (unit.state === 'walk') {
      unit.renderHeadDY = (f % 8 < 4) ? -1 : 0;
      unit.walkPhase = (f >> 2) & 3;
      unit.renderTieDX = (f % 6 < 3) ? 1 : -1;
      unit.renderDanceDX = 0; unit.renderDanceDY = 0; unit.renderJumpDY = 0;
    } else if (unit.state === 'idle') {
      unit.renderHeadDY = Math.round(Math.sin(f * 0.05) * 1.2);
      unit.renderTieDX = 0; unit.renderDanceDX = 0; unit.renderDanceDY = 0; unit.renderJumpDY = 0;
    } else if (unit.state === 'dance') {
      unit.renderDanceDX = Math.round(Math.sin(f * 0.35) * 2);
      unit.renderDanceDY = Math.round(Math.abs(Math.sin(f * 0.35)) * -2);
      unit.renderHeadDY = Math.round(Math.sin(f * 0.7) * 1);
      unit.renderTieDX = Math.round(Math.sin(f * 0.5) * 2);
      unit.renderJumpDY = 0;
    } else if (unit.state === 'jump') {
      unit.jumpTimer++;
      const jt = unit.jumpTimer;
      if (jt < 15) unit.renderJumpDY = -Math.round(Math.sin(jt / 15 * Math.PI) * 6);
      else unit.renderJumpDY = 0;
      unit.renderHeadDY = 0; unit.renderTieDX = 0; unit.renderDanceDX = 0; unit.renderDanceDY = 0;
    } else if (unit.state === 'celebrate') {
      unit.renderDanceDX = Math.round(Math.sin(f * 0.4) * 1);
      unit.renderHeadDY = Math.round(Math.sin(f * 0.5) * 1);
      unit.renderTieDX = 0; unit.renderDanceDY = 0; unit.renderJumpDY = 0;
    } else if (unit.state === 'wave') {
      unit.wavePhase++;
      unit.renderHeadDY = 0; unit.renderTieDX = 0; unit.renderDanceDX = 0; unit.renderDanceDY = 0; unit.renderJumpDY = 0;
    } else {
      unit.renderHeadDY = 0; unit.renderDanceDX = 0; unit.renderDanceDY = 0;
      unit.renderTieDX = 0; unit.renderJumpDY = 0;
    }

    // Hair shimmer — every 3 ticks
    if (f % 3 === 0) {
      const arr = Array.from(unit.cells);
      for (let tries = 0; tries < 3 && arr.length; tries++) {
        const i = arr[(Math.random() * arr.length) | 0];
        if (cells[i] === TRUMP && trumpOwner[i] === unit.id) {
          const cv = cvar[i];
          if (cv === 1 || cv === 5 || cv === 6 || cv === 7) {
            cvar[i] = HAIR_SHADES[(Math.random() * 4) | 0];
            dirty(i % W, (i/W)|0);
          }
        }
      }
    }

    if (unit.state !== 'jump' && Math.random() < 0.02) {
      spawnParticles(unit.baseX + 11, unit.baseY + 1, 1, TRUMP_COLORS[9], 1);
    }

    unit.phantoms.length = 0;
    if (unit.state === 'wave') {
      const waveUp = (unit.wavePhase >> 2) % 2 === 0;
      const armX = 21 + (unit.dir > 0 ? 1 : 0);
      const armY = 14 - (waveUp ? 2 : 0);
      unit.phantoms.push({lx: armX, ly: armY, cv: 0});
      unit.phantoms.push({lx: armX, ly: armY + 1, cv: 0});
      if (waveUp) unit.phantoms.push({lx: armX + 1, ly: armY - 1, cv: 0});
    }
    if (unit.state === 'talk' && unit.mouthOpen) {
      const bx = 11, by = -3;
      unit.phantoms.push({lx: bx, ly: by, cv: 8});
      unit.phantoms.push({lx: bx, ly: by + 1, cv: 8});
    }
    if (unit.state === 'celebrate') {
      unit.phantoms.push({lx: 4, ly: 11, cv: 0});
      unit.phantoms.push({lx: 4, ly: 10, cv: 0});
      unit.phantoms.push({lx: 18, ly: 11, cv: 0});
      unit.phantoms.push({lx: 18, ly: 10, cv: 0});
    }

    let hasGround = false;
    const belowY = maxY + 1;
    if (belowY < H) {
      for (let x = minX; x <= maxX; x++) {
        const c = cells[belowY*W + x];
        if (c !== EMPTY) {
          const ce = ELEMENTS[c];
          if (ce && (ce.type === 'static' || ce.type === 'powder')) { hasGround = true; break; }
        }
      }
    }
    if (!hasGround) {
      if (belowY < H) {
        moveTrumpGroup(unit, 0, 1);
        // Re-scan bounding box after move
        minY = W; maxY = -1;
        for (const i of unit.cells) {
          if (cells[i] === TRUMP && trumpOwner[i] === unit.id) {
            const y = (i/W)|0;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
        unit.baseY = minY;
      }
      continue;
    }

    if (unit.state !== 'walk') continue;

    unit.walkTimer++;
    if (unit.walkTimer < 3) continue;
    unit.walkTimer = 0;

    const dir = unit.dir;
    let canWalk = true;
    for (let y = minY; y <= maxY; y++) {
      const checkX = dir > 0 ? maxX + 1 : minX - 1;
      if (checkX < 0 || checkX >= W) { canWalk = false; break; }
      const c = cells[y*W + checkX];
      if (c !== EMPTY) {
        if (c === TRUMP && trumpOwner[y*W + checkX] === unit.id) continue;
        const ce = ELEMENTS[c];
        if (ce && ce.type === 'static') { canWalk = false; break; }
      }
    }
    if (canWalk && moveTrumpGroup(unit, dir, 0)) {
      unit.baseX += dir;
    } else {
      unit.dir = -unit.dir;
    }
  }
}

function computeTrumpRenderData() {
  const offsets = new Map();
  const phantoms = [];
  for (const unit of trumpUnits) {
    const ox_body = unit.renderDanceDX;
    const oy_body = unit.renderDanceDY + unit.renderJumpDY;

    for (const i of unit.cells) {
      if (cells[i] !== TRUMP || trumpOwner[i] !== unit.id) continue;
      const x = i % W, y = (i/W)|0;
      const lx = x - unit.baseX, ly = y - unit.baseY;

      let ox = ox_body, oy = oy_body;
      let cvOverride = -1;

      if (ly < 12) oy += unit.renderHeadDY;
      if (ly >= 16 && ly <= 20 && lx >= 6 && lx <= 15) ox += unit.renderTieDX;
      if (unit.blinkActive && isEyeCell(lx, ly)) cvOverride = 6;
      if (unit.mouthOpen && isMouthCell(lx, ly)) cvOverride = 2;

      if (ox !== 0 || oy !== 0 || cvOverride >= 0) {
        offsets.set(i, {ox, oy, cvOverride});
      }
    }

    for (const p of unit.phantoms) {
      const px = unit.baseX + p.lx + ox_body;
      const py = unit.baseY + p.ly + oy_body;
      if (px < 0 || px >= W || py < 0 || py >= H) continue;
      phantoms.push({x: px, y: py, cv: p.cv});
    }
  }
  return {offsets, phantoms};
}

/* ═══════════ CREATURE HELPERS ═══════════ */
function tryBurn(x, y, i) {
  if (temp[i] > 280 && Math.random() < 0.05) { setCell(i, FIRE, {temp:800}); dirty(x,y); return true; }
  return false;
}
function walkGround(x, y, i, e, speed) {
  if (tryBurn(x, y, i)) return;
  if (y+1 < H) {
    const below = cells[(y+1)*W+x];
    if (below === EMPTY || canFall(e, below)) { moveTo(x,y,x,y+1); return; }
  }
  if (Math.random() < speed) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const nx = x + dir;
    if (nx >= 0 && nx < W) {
      const target = cells[y*W+nx];
      if (target === EMPTY || canFall(e, target)) moveTo(x,y,nx,y);
    }
  }
}
function flyCreature(x, y, i, e, speed) {
  if (tryBurn(x, y, i)) return;
  if (Math.random() > speed) return;
  const dir = (Math.random()*6)|0;
  const dx = dir === 0 ? -1 : dir === 1 ? 1 : 0;
  const dy = dir === 2 ? -1 : dir === 3 ? 1 : 0;
  if (dx === 0 && dy === 0) return;
  const nx = x+dx, ny = y+dy;
  if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
    const t = cells[ny*W+nx];
    if (t === EMPTY || canRise(e, t)) moveTo(x,y,nx,ny);
  }
}
function updateHuman(x, y, i) {
  if (temp[i] > 250 && Math.random() < 0.10) { setCell(i, FIRE, {temp:800}); dirty(x,y); return; }
  for (let k = 0; k < 4; k++) {
    const nx = x+N4[k][0], ny = y+N4[k][1];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const t = cells[ny*W+nx];
    if (t === ZOMBIE && Math.random() < 0.20) { setCell(i, ZOMBIE); dirty(x,y); return; }
    if ((t === LAVA || t === MAGMA) && Math.random() < 0.35) { setCell(i, FIRE, {temp:900}); dirty(x,y); return; }
    if (t === ACID && Math.random() < 0.05) { setCell(i, SLIME); dirty(x,y); return; }
  }
  walkGround(x,y,i,HUMAN,0.30);
}
function updateZombie(x, y, i) {
  if (tryBurn(x, y, i)) return;
  for (let k = 0; k < 4; k++) {
    const nx = x+N4[k][0], ny = y+N4[k][1];
    if (nx < 0 || nx >= W || ny < 0 || ny >= H) continue;
    const j = ny*W+nx;
    if (cells[j] === HUMAN && Math.random() < 0.25) { setCell(j, ZOMBIE); dirty(nx,ny); }
  }
  walkGround(x,y,i,ZOMBIE,0.25);
}
function updateGhost(x, y, i) {
  if (y > 0 && Math.random() < 0.4) {
    const j = (y-1)*W+x;
    if (cells[j] === EMPTY) { moveTo(x,y,x,y-1); return; }
  }
  if (Math.random() < 0.4) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const nx = x+dir;
    if (nx >= 0 && nx < W && cells[y*W+nx] === EMPTY) moveTo(x,y,nx,y);
  }
}
function updateRobot(x, y, i) {
  if (temp[i] > 800 && Math.random() < 0.05) { setCell(i, MOLTEN, {temp:1500}); dirty(x,y); return; }
  walkGround(x,y,i,ROBOT,0.28);
}
function updateFish(x, y, i) {
  let wc = 0;
  for (let k = 0; k < 4; k++) { const nx = x+N4[k][0], ny = y+N4[k][1]; if (nx >= 0 && nx < W && ny >= 0 && ny < H && cells[ny*W+nx] === WATER) wc++; }
  if (wc === 0 && Math.random() < 0.05) { setCell(i, FLESH); dirty(x,y); return; }
  if (Math.random() < 0.45) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const vertical = Math.random() < 0.5;
    const nx = x + (vertical?0:dir), ny = y + (vertical?dir:0);
    if (nx >= 0 && nx < W && ny >= 0 && ny < H) {
      const t = cells[ny*W+nx];
      if (t === EMPTY || t === WATER) moveTo(x,y,nx,ny);
    }
  }
}
function updateSpider(x, y, i) {
  if (tryBurn(x, y, i)) return;
  if (Math.random() < 0.08 && y > 0 && cells[(y-1)*W+x] === EMPTY) { moveTo(x,y,x,y-1); return; }
  walkGround(x,y,i,SPIDER,0.4);
}
function updateSnake(x, y, i) {
  if (tryBurn(x, y, i)) return;
  if (y+1 < H) { const below = cells[(y+1)*W+x]; if (below === EMPTY || canFall(SNAKE, below)) { moveTo(x,y,x,y+1); return; } }
  if (Math.random() < 0.5) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const nx = x+dir;
    if (nx >= 0 && nx < W && cells[y*W+nx] === EMPTY) moveTo(x,y,nx,y);
  }
}
function genericWalker(id, speed) {
  return function(x, y, i) { if (tryBurn(x,y,i)) return; walkGround(x,y,i,id,speed); };
}
function genericFlyer(id, speed, hasLife) {
  return function(x, y, i) {
    if (tryBurn(x,y,i)) return;
    if (hasLife && --life[i] <= 0) { cells[i] = EMPTY; dirty(x,y); return; }
    flyCreature(x,y,i,id,speed);
  };
}
function genericSwimmer(id, speed) {
  return function(x, y, i) { updateFish(x, y, i); };
}

/* ═══════════ CELL DISPATCH ═══════════ */
function updateCell(x, y, i) {
  if (moved[i]) return;
  const e = cells[i];
  if (e === EMPTY) { if (temp[i] > AMBIENT+1 || temp[i] < AMBIENT-1) diffuse(x,y,i); return; }
  if (temp[i] > AMBIENT+1 || temp[i] < AMBIENT-1) diffuse(x,y,i);
  const el = ELEMENTS[e];
  if (!el) { cells[i] = EMPTY; return; }
  if (el.melt && temp[i] > el.melt) { setCell(i, el.meltTo, {temp:temp[i]}); return; }
  if (el.boil && temp[i] > el.boil) { setCell(i, el.boilTo, {temp:temp[i]}); return; }
  if (el.freeze && temp[i] < el.freeze) { setCell(i, el.freezeTo, {temp:temp[i]}); return; }
  if (el.condense && temp[i] < el.condense) { setCell(i, el.condenseTo, {temp:temp[i]}); return; }
  if (temp[i] > el.ignition) {
    if (el.explosion) { explode(x,y,el.explosion); return; }
    setCell(i, FIRE, {temp:800}); return;
  }
  if (checkReaction(x, y, i)) return;
  const h = handlers[e];
  if (h) { h(x,y,i); return; }
  if (el.type === 'powder') movePowder(x,y,e);
  else if (el.type === 'liquid') moveLiquid(x,y,e,el.dispersion);
  else if (el.type === 'gas') moveGas(x,y,e);
}

/* ═══════════ SIMULATION STEP ═══════════ */
function step() {
  moved.fill(0);
  updateTrumpUnits();
  for (let cy = chunkRows-1; cy >= 0; cy--) {
    const rowBase = cy*chunkCols;
    for (let cx = 0; cx < chunkCols; cx++) {
      if (!active[rowBase+cx]) continue;
      const x0 = cx*CHUNK, y0 = cy*CHUNK;
      const x1 = Math.min(x0+CHUNK, W);
      const y1 = Math.min(y0+CHUNK, H);
      const flip = (frame+cx+cy) & 1;
      for (let y = y1-1; y >= y0; y--) {
        const row = y*W;
        if (flip) for (let x = x1-1; x >= x0; x--) updateCell(x,y,row+x);
        else for (let x = x0; x < x1; x++) updateCell(x,y,row+x);
      }
    }
  }
  const tmp = active; active = nextActive; nextActive = tmp;
  nextActive.fill(0);
  frame++;
  if (weatherRain && Math.random() < 0.4) {
    const rx = (Math.random()*W)|0;
    if (cells[rx] === EMPTY) { setCell(rx, WATER); dirty(rx,0); }
  }
  if (nightMode) dayPhase = (dayPhase + 0.001) % 1;
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if (p.life <= 0) particles.splice(k, 1);
  }
  if (shakeAmount > 0) shakeAmount *= 0.9;
  if (flashAmount > 0) flashAmount *= 0.85;
}

/* ═══════════ RENDER ═══════════ */
function render() {
  let skyTint = 0;
  if (nightMode) { const t = Math.sin(dayPhase*Math.PI*2); skyTint = t < 0 ? -t*0.6 : 0; }

  const {offsets: trumpOffsets, phantoms: trumpPhantoms} = computeTrumpRenderData();

  for (let i = 0; i < N; i++) {
    const e = cells[i];
    let c, g = 0;
    if (showTemp) {
      c = tempColor(temp[i]);
      if (e !== EMPTY && temp[i] > 500) { const f = Math.min(1, (temp[i]-500)/1200); g = rgb(255*f, 100*f*f, 20*f*f*f); }
    } else if (e === EMPTY) {
      c = bg[i];
      if (skyTint > 0) {
        const b = (c >> 16) & 0xFF, gr = (c >> 8) & 0xFF, r = c & 0xFF;
        c = rgb(r*(1-skyTint*0.5), gr*(1-skyTint*0.5), b*(1-skyTint*0.3));
      }
    } else if (e === FIRE) {
      const k = life[i] >> 2;
      c = FIRE_PAL[k > 15 ? 15 : k];
      g = rgb(255, 120, 30);
    } else if (e === TRUMP) {
      if (trumpOffsets.has(i)) {
        buf32[i] = bg[i];
        glow32[i] = 0;
        continue;
      }
      c = TRUMP_COLORS[cvar[i] & 7];
      if (temp[i] > 420) { const f = Math.min(1, (temp[i]-420)/1000); g = rgb(255*f, 110*f*f, 30*f*f*f); }
    } else {
      const el = ELEMENTS[e];
      if (!el) { c = rgb(255,0,255); }
      else {
        c = palette[e*8 + (cvar[i] & 7)];
        if (rainbowMode) {
          const t = (frame * 0.02 + i * 0.0001) % 1;
          c = rgb(255 * Math.abs(Math.sin(t * Math.PI)), 255 * Math.abs(Math.sin((t + 0.33) * Math.PI)), 255 * Math.abs(Math.sin((t + 0.66) * Math.PI)));
        }
        if (el.glow) g = rgb(el.glow[0], el.glow[1], el.glow[2]);
        else if (temp[i] > 420) { const f = Math.min(1, (temp[i]-420)/1000); g = rgb(255*f, 110*f*f, 30*f*f*f); }
      }
    }
    buf32[i] = c; glow32[i] = g;
  }

  for (const [i, o] of trumpOffsets) {
    const x = i % W, y = (i/W)|0;
    const tx = x + o.ox, ty = y + o.oy;
    if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
    const ti = ty * W + tx;
    const cv = o.cvOverride >= 0 ? o.cvOverride : (cvar[i] & 7);
    buf32[ti] = TRUMP_COLORS[cv];
  }

  for (const p of trumpPhantoms) {
    const i = p.y * W + p.x;
    if (cells[i] === EMPTY || (cells[i] === TRUMP && trumpOwner[i])) {
      buf32[i] = TRUMP_COLORS[p.cv];
    }
  }

  offCtx.putImageData(imgData, 0, 0);
  const cw = canvas.width, ch = canvas.height;
  const viewW = cw/(PIXEL*viewZoom), viewH = ch/(PIXEL*viewZoom);
  const sx = (Math.random() - 0.5) * shakeAmount;
  const sy = (Math.random() - 0.5) * shakeAmount;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = viewZoom > 1;
  ctx.drawImage(offCanvas, viewPanX, viewPanY, viewW, viewH, sx, sy, cw, ch);
  glowCtx.putImageData(glowData, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = 0.55;
  ctx.drawImage(glowCanvas, viewPanX, viewPanY, viewW, viewH, sx, sy, cw, ch);
  if (particles.length > 0) {
    ctx.imageSmoothingEnabled = false;
    for (const p of particles) {
      const px = (p.x - viewPanX) * PIXEL * viewZoom + sx;
      const py = (p.y - viewPanY) * PIXEL * viewZoom + sy;
      const alpha = p.life / p.maxLife;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = `rgba(${(p.color >> 0) & 0xFF},${(p.color >> 8) & 0xFF},${(p.color >> 16) & 0xFF},${alpha})`;
      const s = p.size * PIXEL * viewZoom;
      ctx.fillRect(px, py, s, s);
    }
  }
  if (flashAmount > 0.01) {
    ctx.globalAlpha = flashAmount;
    ctx.fillStyle = 'white';
    ctx.fillRect(0, 0, cw, ch);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (showGrid) {
    const s = PIXEL * viewZoom;
    ctx.strokeStyle = 'rgba(255,255,255,.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    const gx0 = Math.ceil(viewPanX/8)*8, gy0 = Math.ceil(viewPanY/8)*8;
    for (let gx = gx0; gx < viewPanX+viewW; gx += 8) { const gsx = (gx-viewPanX)*s; ctx.moveTo(gsx,0); ctx.lineTo(gsx,ch); }
    for (let gy = gy0; gy < viewPanY+viewH; gy += 8) { const gsy = (gy-viewPanY)*s; ctx.moveTo(0,gsy); ctx.lineTo(cw,gsy); }
    ctx.stroke();
  }
}
function updateMinimap() {
  miniCtx.imageSmoothingEnabled = true;
  miniCtx.clearRect(0, 0, MINI_W, MINI_H);
  miniCtx.drawImage(offCanvas, 0, 0, W, H, 0, 0, MINI_W, MINI_H);
  const viewW = canvas.width/(PIXEL*viewZoom), viewH = canvas.height/(PIXEL*viewZoom);
  miniCtx.strokeStyle = '#5ee0a0';
  miniCtx.lineWidth = 1;
  miniCtx.strokeRect(viewPanX/W*MINI_W, viewPanY/H*MINI_H, viewW/W*MINI_W, viewH/H*MINI_H);
}

/* ═══════════ PAINTING ═══════════ */
function paintAt(gx, gy, elem) {
  if (elem === TRUMP) { paintTrump(gx, gy); return; }
  const r = brushSize, r2 = r*r;
  for (let dy = -r; dy <= r; dy++) {
    const y = gy+dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      if (dx*dx+dy*dy > r2) continue;
      const x = gx+dx;
      if (x < 0 || x >= W) continue;
      const i = y*W+x;
      if (elem === EMPTY) { cells[i] = EMPTY; life[i] = 0; temp[i] = AMBIENT; if (trumpOwner) trumpOwner[i] = 0; }
      else setCell(i, elem);
      dirty(x,y);
    }
  }
}
function stamp(gx, gy, elem) {
  paintAt(gx, gy, elem);
  if (symmetry) paintAt(W-1-gx, gy, elem);
}
function heatBrush(gx, gy, delta) {
  const r = brushSize, r2 = r*r;
  for (let dy = -r; dy <= r; dy++) {
    const y = gy+dy;
    if (y < 0 || y >= H) continue;
    for (let dx = -r; dx <= r; dx++) {
      if (dx*dx+dy*dy > r2) continue;
      const x = gx+dx;
      if (x < 0 || x >= W) continue;
      const i = y*W+x;
      temp[i] += delta;
      if (temp[i] > 3000) temp[i] = 3000;
      if (temp[i] < -200) temp[i] = -200;
      dirty(x,y);
    }
  }
}
function strokeLine(x0, y0, x1, y1, elem) {
  const dx = x1-x0, dy = y1-y0;
  const steps = Math.max(Math.abs(dx), Math.abs(dy));
  if (steps === 0) { stamp(x1, y1, elem); return; }
  for (let s = 0; s <= steps; s++) stamp(Math.round(x0+dx*s/steps), Math.round(y0+dy*s/steps), elem);
}
function drawRect(x0, y0, x1, y1, elem) {
  const xa = Math.min(x0,x1), xb = Math.max(x0,x1);
  const ya = Math.min(y0,y1), yb = Math.max(y0,y1);
  for (let y = ya; y <= yb; y++) for (let x = xa; x <= xb; x++) stamp(x, y, elem);
}
function floodFill(x0, y0, newElem) {
  if (newElem === TRUMP) { paintTrump(x0, y0); return; }
  if (x0 < 0 || x0 >= W || y0 < 0 || y0 >= H) return;
  const target = cells[y0*W+x0];
  if (target === newElem) return;
  const stack = [[x0,y0]];
  const visited = new Uint8Array(N);
  while (stack.length) {
    const [x,y] = stack.pop();
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    const i = y*W+x;
    if (visited[i]) continue;
    if (cells[i] !== target) continue;
    visited[i] = 1;
    if (newElem === EMPTY) { cells[i] = EMPTY; life[i] = 0; temp[i] = AMBIENT; if (trumpOwner) trumpOwner[i] = 0; }
    else setCell(i, newElem);
    dirty(x,y);
    stack.push([x-1,y],[x+1,y],[x,y-1],[x,y+1]);
  }
}

/* ═══════════ FUN TOOL ACTIONS ═══════════ */
function toolExplosion(gx, gy) { explode(gx, gy, 8 + Math.floor(brushSize * 0.8)); }
function toolMeteor(gx, gy) {
  for (let dy = 0; dy < Math.min(gy, H); dy++) { setCell(dy * W + gx, LAVA, {temp: 1500}); dirty(gx, dy); }
  explode(gx, gy, 10);
  spawnParticles(gx, gy, 30, rgb(255, 150, 50), 4);
  shakeAmount = Math.min(40, shakeAmount + 25);
  flashAmount = 0.6;
}
function toolTornado(gx, gy) {
  for (let dy = -8; dy <= 8; dy++) for (let dx = -6; dx <= 6; dx++) {
    const rad = Math.sqrt(dx*dx + dy*dy);
    if (rad > 7) continue;
    const x = gx + dx, y = gy + dy;
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    const j = y * W + x;
    const t = cells[j];
    if (t === EMPTY || ELEMENTS[t].type === 'static') continue;
    const angle = Math.atan2(dy, dx) + Math.PI / 2;
    const tx = x + Math.round(Math.cos(angle));
    const ty = y + Math.round(Math.sin(angle));
    if (tx >= 0 && tx < W && ty >= 0 && ty < H && cells[ty*W+tx] === EMPTY) moveTo(x, y, tx, ty);
  }
}

const undoStack = [], redoStack = [];
const MAX_UNDO = 20;
function snapshot() {
  undoStack.push(cells.slice());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack.length = 0;
  updateUndoBtns();
}
function doUndo() {
  if (!undoStack.length) return;
  redoStack.push(cells.slice());
  cells.set(undoStack.pop());
  markAllActive(); updateUndoBtns();
}
function doRedo() {
  if (!redoStack.length) return;
  undoStack.push(cells.slice());
  cells.set(redoStack.pop());
  markAllActive(); updateUndoBtns();
}
function updateUndoBtns() {
  document.getElementById('undoBtn').disabled = undoStack.length === 0;
  document.getElementById('redoBtn').disabled = redoStack.length === 0;
}

document.getElementById('redoBtn').onclick = doRedo;

function toB64(u8) { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i+CH)); return btoa(s); }
function fromB64(str) { const b = atob(str); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
const slotSel = document.getElementById('slotSel');

    localStorage.setItem('elemental-sandbox-v9-' + slot, JSON.stringify(data));
    toast('Saved slot ' + slot);

function blankWorld() {
  cells.fill(EMPTY); life.fill(0); temp.fill(AMBIENT);
  if (trumpOwner) trumpOwner.fill(0);
  trumpUnits.length = 0;
  for (let i = 0; i < N; i++) cvar[i] = (Math.random()*8)|0;
}
function eid(name) { const e = EL[name]; return e ? e.id : EMPTY; }

function applyPreset(name) {
  blankWorld();
  const floorY = H - Math.max(4, (H*0.08)|0);
  if (name === 'blank') { markAllActive(); return; }
  for (let y = floorY; y < H; y++) for (let x = 0; x < W; x++) setCell(y*W+x, STONE);

  if (name === 'trump') {
    const cx = W/2|0;
    const cy = floorY - 40;
    paintTrump(cx, cy);
    for (let i = 0; i < 8; i++) { const x = cx - 60 + i * 15; if (x >= 0 && x < W) setCell((floorY-3)*W+x, HUMAN); }
    for (let i = 0; i < 3; i++) { const x = 20 + Math.floor(Math.random() * (W-40)); setCell((floorY-3)*W+x, FIREWORK); }
    for (let y = floorY-2; y < floorY; y++) for (let x = 0; x < W; x++) setCell(y*W+x, DIRT);
  } else if (name === 'garden' || name === 'forest') {
    const dd = name === 'forest' ? 8 : 5;
    for (let y = floorY-dd; y < floorY; y++) for (let x = 0; x < W; x++) setCell(y*W+x, DIRT);
    if (name === 'forest') {
      const tc = Math.max(3, W/30|0);
      for (let t = 0; t < tc; t++) {
        const tx = 20 + Math.floor(Math.random()*(W-40));
        const th = 25 + (Math.random()*25|0);
        for (let h = 0; h < th; h++) { const y = floorY-dd-h; if (y < 0) break; setCell(y*W+tx, WOOD); }
        const topY = floorY-dd-th;
        for (let dy = -6; dy <= 6; dy++) for (let dx = -8; dx <= 8; dx++) {
          if (dx*dx+dy*dy > 60) continue;
          const x = tx+dx, y = topY+dy;
          if (x < 0 || x >= W || y < 0 || y >= H) continue;
          if (cells[y*W+x] === EMPTY && Math.random() < 0.85) setCell(y*W+x, PLANT);
        }
      }
    } else {
      const cx = (W*0.7)|0, peak = floorY-dd-30;
      for (let y = peak; y < floorY-dd; y++) {
        const t = (y-peak)/(floorY-dd-peak);
        const half = Math.round(6+t*40);
        for (let x = cx-half; x <= cx+half; x++) {
          if (x < 0 || x >= W) continue;
          if (cells[y*W+x] === EMPTY) setCell(y*W+x, SAND);
        }
      }
      const bx = (W*0.22)|0;
      for (let y = floorY-dd-14; y < floorY-dd; y++)
        for (let x = bx-24; x <= bx+24; x++) { if (x < 0 || x >= W) continue; if (cells[y*W+x] === EMPTY) setCell(y*W+x, WATER); }
      for (let p = 0; p < 8; p++) {
        const px = 15 + Math.floor(Math.random()*(W-30)), py = floorY-dd-1;
        if (py < 0) continue;
        if (cells[py*W+px] === EMPTY) { const ph = 3+(Math.random()*8|0); for (let h = 1; h <= ph; h++) { if (py-h < 0) break; setCell((py-h)*W+px, PLANT); } }
      }
    }
  } else if (name === 'winter') {
    for (let y = floorY-20; y < floorY; y++) for (let x = 0; x < W; x++) if (cells[y*W+x] === EMPTY) setCell(y*W+x, SNOW);
    for (let y = floorY-4; y < floorY; y++) for (let x = 0; x < W; x++) setCell(y*W+x, ICE);
  } else if (name === 'ocean') {
    for (let y = floorY-60; y < floorY; y++) for (let x = 0; x < W; x++) if (cells[y*W+x] === EMPTY) setCell(y*W+x, WATER);
  } else if (name === 'volcano') {
    const cx = (W/2)|0, peakY = floorY - Math.min(90, (H*0.55)|0);
    for (let y = peakY; y < floorY; y++) {
      const t = (y-peakY)/(floorY-peakY), half = Math.round(60-t*50);
      for (let x = cx-half; x <= cx+half; x++) { if (x < 0 || x >= W) continue; if (cells[y*W+x] === EMPTY) setCell(y*W+x, STONE); }
    }
    for (let y = peakY-6; y <= peakY; y++) for (let x = cx-8; x <= cx+8; x++) { if (x < 0 || x >= W || y < 0 || y >= H) continue; setCell(y*W+x, LAVA); }
  } else if (name === 'reactor') {
    const cx = (W/2)|0;
    for (let i = 0; i < 12; i++) { const x = cx-40+i*7; if (x < 0 || x >= W) continue; setCell((floorY-20)*W+x, i % 2 === 0 ? HEATER : COOLER); }
    for (let i = 0; i < 20; i++) { const x = 20+Math.floor(Math.random()*(W-40)); const y = floorY-30-(Math.random()*40|0); setCell(y*W+x, WATER); }
    for (let i = 0; i < 5; i++) {
      const x = 50+Math.floor(Math.random()*(W-100));
      setCell((floorY-5)*W+x, BATTERY);
      setCell((floorY-6)*W+x, WIRE);
      setCell((floorY-7)*W+x, WIRE);
      setCell((floorY-8)*W+x, TNT);
    }
  } else if (name === 'lab') {
    const cx = (W/2)|0;
    for (let y = floorY-8; y < floorY; y++) for (let x = cx-60; x <= cx-20; x++) { if (x < 0 || x >= W) continue; setCell(y*W+x, LAVA); }
    for (let y = floorY-8; y < floorY; y++) for (let x = cx+20; x <= cx+60; x++) { if (x < 0 || x >= W) continue; setCell(y*W+x, WATER); }
    for (let y = floorY-20; y < floorY; y++) setCell(y*W+cx, METAL);
  } else if (name === 'village') {
    for (let y = floorY-2; y < floorY; y++) for (let x = 0; x < W; x++) setCell(y*W+x, DIRT);
    for (let h = 0; h < 3; h++) {
      const hx = 30+h*70+Math.floor(Math.random()*20), hw = 25, hh = 20;
      for (let x = hx; x < hx+hw; x++) for (let y = floorY-hh; y < floorY-2; y++) {
        if (x < 0 || x >= W || y < 0 || y >= H) continue;
        if (x === hx || x === hx+hw-1 || y === floorY-hh) setCell(y*W+x, WOOD);
      }
    }
    for (let i = 0; i < 8; i++) { const x = 20+Math.floor(Math.random()*(W-40)); setCell((floorY-3)*W+x, HUMAN); }
    for (let i = 0; i < 4; i++) { const x = Math.floor(W*0.7+Math.random()*(W*0.25)); if (x < W) setCell((floorY-3)*W+x, ZOMBIE); }
    for (let i = 0; i < 3; i++) { const x = 20+Math.floor(Math.random()*(W-40)); setCell((floorY-3)*W+x, COW); }
    for (let i = 0; i < 4; i++) { const x = 20+Math.floor(Math.random()*(W-40)); setCell((floorY-3)*W+x, CHICKEN); }
  } else if (name === 'city') {
    for (let y = floorY-3; y < floorY; y++) for (let x = 0; x < W; x++) setCell(y*W+x, eid('Asphalt'));
    for (let i = 0; i < 8; i++) {
      const bw = 20+Math.floor(Math.random()*15), bh = 40+Math.floor(Math.random()*40);
      const bx = 10+i*(W-20)/8;
      for (let x = bx; x < bx+bw && x < W; x++) for (let y = floorY-3-bh; y < floorY-3; y++) {
        if (x < 0 || y < 0 || y >= H) continue;
        if (x === bx || x === bx+bw-1 || y === floorY-3-bh) setCell(y*W+x, eid('Cement'));
        else if (Math.random() < 0.02) setCell(y*W+x, GLASS);
      }
    }
    for (let i = 0; i < 10; i++) { const x = 20+Math.floor(Math.random()*(W-40)); setCell((floorY-4)*W+x, HUMAN); }
  } else if (name === 'zoo') {
    for (let y = floorY-2; y < floorY; y++) for (let x = 0; x < W; x++) setCell(y*W+x, eid('Grass'));
    const cages = [{x:20,w:80},{x:120,w:80},{x:220,w:80},{x:320,w:80}];
    for (const c of cages) for (let y = floorY-30; y < floorY-2; y++) { setCell(y*W+c.x, GLASS); setCell(y*W+c.x+c.w, GLASS); }
    const animals = [WOLF, FOX, BEAR, DEER, RABBIT, MOUSE, RAT, SQUIRREL];
    for (let i = 0; i < animals.length; i++) {
      const c = cages[i % cages.length];
      const x = c.x+5+Math.floor(Math.random()*(c.w-10));
      setCell((floorY-4)*W+x, animals[i]);
    }
  }
  markAllActive();
}

/* ═══════════ TOAST ═══════════ */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1400);
}

/* ═══════════ INPUT ═══════════ */
let drawing = false, erasing = false, lastX = -1, lastY = -1;
let dragStart = null, savedCells = null;
const tooltipEl = document.getElementById('tooltip');
const coordEl = document.getElementById('coordPanel');

function toGrid(ev) {
  const r = canvas.getBoundingClientRect();
  const scale = PIXEL * viewZoom;
  return [Math.floor(viewPanX + (ev.clientX - r.left)/scale), Math.floor(viewPanY + (ev.clientY - r.top)/scale)];
}
function getPaintElem() {
  if (randomBrush) { const pool = ELEMENTS.filter(e => e.id !== EMPTY && e.cat !== 'tool'); return pool[Math.floor(Math.random()*pool.length)].id; }
  return (erasing || currentTool === 'erase') ? EMPTY : currentElement;
}
canvas.addEventListener('pointerdown', ev => {
  if (ev.button === 1) { ev.preventDefault(); panning = true; panStartX = ev.clientX; panStartY = ev.clientY; panStartPanX = viewPanX; panStartPanY = viewPanY; canvas.setPointerCapture(ev.pointerId); return; }
  canvas.setPointerCapture(ev.pointerId);
  drawing = true;
  erasing = ev.button === 2 || ev.shiftKey;
  const [gx, gy] = toGrid(ev);
  lastX = gx; lastY = gy;
  if (currentTool === 'explosion') { snapshot(); toolExplosion(gx, gy); drawing = false; return; }
  if (currentTool === 'meteor') { snapshot(); toolMeteor(gx, gy); drawing = false; return; }
  if (currentTool === 'tornado') { snapshot(); toolTornado(gx, gy); drawing = false; return; }
  if (currentTool === 'eyedropper') {
    if (gx >= 0 && gx < W && gy >= 0 && gy < H) {
      const e = cells[gy*W+gx];
      if (e !== EMPTY) { selectElement(e); setTab('all'); toast(`${ELEMENTS[e].name} · ${temp[gy*W+gx].toFixed(0)}°`); }
    }
    drawing = false; return;
  }
  if (currentTool === 'heat') { heatBrush(gx, gy, 200); drawing = false; return; }
  if (currentTool === 'cool') { heatBrush(gx, gy, -200); drawing = false; return; }
  if (currentTool === 'fill') { snapshot(); floodFill(gx, gy, getPaintElem()); drawing = false; return; }
  snapshot();
  if (currentTool === 'line' || currentTool === 'rect') { dragStart = [gx, gy]; savedCells = cells.slice(); }
  else stamp(gx, gy, getPaintElem());
  ev.preventDefault();
});
canvas.addEventListener('pointermove', ev => {
  if (panning) {
    const scale = PIXEL*viewZoom;
    viewPanX = panStartPanX - (ev.clientX-panStartX)/scale;
    viewPanY = panStartPanY - (ev.clientY-panStartY)/scale;
    clampView(); return;
  }
  const [gx, gy] = toGrid(ev);
  coordEl.textContent = `${gx}, ${gy}`;
  if (!drawing) {
    if (gx >= 0 && gx < W && gy >= 0 && gy < H && cells[gy*W+gx] !== EMPTY) {
      const i = gy*W+gx;
      const el = ELEMENTS[cells[i]];
      let hints = '';
      const m = RX_MAP.get(cells[i]);
      if (m) { const parts = []; for (const [k] of m) parts.push(ELEMENTS[k].name); hints = '\nreacts: ' + parts.slice(0, 3).join(', '); }
      tooltipEl.textContent = `${el.name} · ${temp[i].toFixed(0)}°${hints}`;
      tooltipEl.style.left = (ev.clientX+14)+'px';
      tooltipEl.style.top = (ev.clientY+14)+'px';
      tooltipEl.style.display = 'block';
    } else tooltipEl.style.display = 'none';
  } else tooltipEl.style.display = 'none';
  if (!drawing) return;
  if (currentTool === 'heat') { heatBrush(gx, gy, 200); return; }
  if (currentTool === 'cool') { heatBrush(gx, gy, -200); return; }
  if (currentTool === 'explosion') { if (Math.random() < 0.3) toolExplosion(gx, gy); return; }
  if (currentTool === 'tornado') { toolTornado(gx, gy); return; }
  if (currentTool === 'line' && dragStart) { cells.set(savedCells); strokeLine(dragStart[0], dragStart[1], gx, gy, getPaintElem()); markAllActive(); return; }
  if (currentTool === 'rect' && dragStart) { cells.set(savedCells); drawRect(dragStart[0], dragStart[1], gx, gy, getPaintElem()); markAllActive(); return; }
  if (currentTool === 'fill') return;
  if (gx === lastX && gy === lastY) return;
  strokeLine(lastX, lastY, gx, gy, getPaintElem());
  lastX = gx; lastY = gy;
});
function endStroke() { if (panning) { panning = false; return; } drawing = false; dragStart = null; savedCells = null; lastX = lastY = -1; }
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  if (ev.ctrlKey || ev.metaKey) {
    const r = canvas.getBoundingClientRect();
    setZoom(viewZoom * (ev.deltaY > 0 ? 0.9 : 1.1), ev.clientX - r.left, ev.clientY - r.top);
  } else {
    brushSize = Math.max(1, Math.min(30, brushSize + (ev.deltaY > 0 ? 1 : -1)));
    brushInput.value = brushSize; brushVal.textContent = brushSize;
  }
}, {passive:false});

/* ═══════════ KEYBOARD ═══════════ */
window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
  if (ev.key === ' ') { ev.preventDefault(); pauseBtn.click(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); if (ev.shiftKey) doRedo(); else doUndo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); document.getElementById('saveBtn').click(); return; }
  if (ev.key === 'c' || ev.key === 'C') { document.getElementById('clearBtn').click(); return; }
  if (ev.key === 'r' || ev.key === 'R') { document.getElementById('resetBtn').click(); return; }
  if (ev.key === '0') { document.getElementById('zoomReset').click(); return; }
  if (ev.key === '+' || ev.key === '=') { document.getElementById('zoomIn').click(); return; }
  if (ev.key === '-') { document.getElementById('zoomOut').click(); return; }
  switch (ev.key.toLowerCase()) {
    case 'b': selectTool('brush'); break;
    case 'l': selectTool('line'); break;
    case 'f': selectTool('fill'); break;
    case 'e': selectTool('erase'); break;
    case 'm': symBtn.click(); break;
    case 'h': tempBtn.click(); break;
    case 'i': selectTool('eyedropper'); break;
    case 'g': gridBtn.click(); break;
    case 'x': randomBtn.click(); break;
  }
});

/* ═══════════ STATS + LOG PANEL ═══════════ */
function updateStats() {
  if (!document.getElementById('statsPanel').classList.contains('show')) return;
  const counts = new Map();
  for (let i = 0; i < N; i++) { const e = cells[i]; if (e !== EMPTY) counts.set(e, (counts.get(e) || 0) + 1); }
  const sorted = [...counts.entries()].sort((a, b) => b[1]-a[1]).slice(0, 5);
  document.getElementById('statsContent').innerHTML = sorted.map(([e, c]) =>
    `<div class="stat-row"><span>${ELEMENTS[e].name}</span><span>${c}</span></div>`).join('');
}
function updateLogPanel() {
  if (!logVisible || !logDirty) return;
  logDirty = false;
  document.getElementById('logContent').innerHTML = logLines.map(l => `<div class="log-line">${l}</div>`).join('');
}

/* ═══════════ MAIN LOOP ═══════════ */
const fpsEl = document.getElementById('fps');
const cellEl = document.getElementById('cells');
let fpsAcc = 0, fpsFrames = 0, fpsTimer = 0, lastT = performance.now();
let lastMinimapT = 0, lastStatsT = 0;

function loop(t) {
  const dt = t - lastT;
  lastT = t;
  if (!paused) {
    const effectiveSpeed = slowMotion ? speedMult * 0.25 : speedMult;
    stepAccum += effectiveSpeed;
    let n = 0;
    while (stepAccum >= 1 && n < 4) { step(); stepAccum -= 1; n++; }
  }
  render();
  if (t - lastMinimapT > 200) { updateMinimap(); lastMinimapT = t; }
  if (t - lastStatsT > 500) { updateStats(); lastStatsT = t; }
  updateLogPanel();
  fpsAcc += dt; fpsFrames++; fpsTimer += dt;
  if (fpsTimer > 500) {
    fpsEl.textContent = Math.round(fpsFrames / (fpsAcc / 1000)) + ' fps';
    let a = 0; for (let i = 0; i < chunkCount; i++) if (active[i]) a++;
    cellEl.textContent = `${W}×${H} · ${ELEMENTS.length} els`;
    fpsAcc = 0; fpsFrames = 0; fpsTimer = 0;
  }
  requestAnimationFrame(loop);
}

/* ═══════════ BOOT ═══════════ */
window.addEventListener('resize', layout);
const hudEl = document.getElementById('bottomHud');
if (window.ResizeObserver && hudEl) {
  let rafId = 0;
  new ResizeObserver(() => { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(layout); }).observe(hudEl);
}

layout();
applyPreset('garden');
requestAnimationFrame(loop);

})();
</script>
